services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_DOCKER_BOOTSTRAP:-kafka:29092},EXTERNAL://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_DOCKER_BOOTSTRAP:-kafka:29092}
      TOPIC1: ${KAFKA_TOPIC1:-topic1}
      TOPIC2: ${KAFKA_TOPIC2:-topic2}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in "$$TOPIC1" "$$TOPIC2"; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$KAFKA_BOOTSTRAP" \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.24
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ELASTICSEARCH_HEAP_SIZE:-512m} -Xmx${ELASTICSEARCH_HEAP_SIZE:-512m}"
    ports:
      - "127.0.0.1:${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 8s
      retries: 25
      start_period: 25s

  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.24
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_DOCKER_URL:-http://elasticsearch:9200}
      ENTITY_INDEX: ${ELASTICSEARCH_ENTITY_INDEX:-named-entities}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if curl -fsSI "$$ELASTICSEARCH_URL/$$ENTITY_INDEX" >/dev/null; then
          exit 0
        fi
        curl -fsS -X PUT "$$ELASTICSEARCH_URL/$$ENTITY_INDEX" \
          -H 'Content-Type: application/json' \
          -d '{"settings":{"number_of_shards":1,"number_of_replicas":0},"mappings":{"properties":{"entity":{"type":"keyword","ignore_above":512},"count":{"type":"long"},"@timestamp":{"type":"date"}}}}'

  logstash:
    build:
      context: ${LOGSTASH_CONFIG_DIR:-./part1}
      args:
        LOGSTASH_CONFIG_FILE: ${LOGSTASH_CONFIG_FILE:-logstash.conf}
      dockerfile_inline: |
        FROM docker.elastic.co/logstash/logstash:8.19.24
        ARG LOGSTASH_CONFIG_FILE
        COPY --chown=1000:0 $${LOGSTASH_CONFIG_FILE} /usr/share/logstash/pipeline/entities.conf
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      elasticsearch-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_DOCKER_BOOTSTRAP:-kafka:29092}
      KAFKA_TOPIC2: ${KAFKA_TOPIC2:-topic2}
      LOGSTASH_KAFKA_GROUP: ${LOGSTASH_KAFKA_GROUP:-cs4371-entity-indexer}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_DOCKER_URL:-http://elasticsearch:9200}
      ENTITY_INDEX: ${ELASTICSEARCH_ENTITY_INDEX:-named-entities}
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      PIPELINE_WORKERS: "1"
      PIPELINE_ORDERED: "true"
      QUEUE_TYPE: persisted
      QUEUE_CHECKPOINT_WRITES: "1"
    command: ["logstash", "-f", "/usr/share/logstash/pipeline/entities.conf"]
    volumes:
      - logstash-data:/usr/share/logstash/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.24
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: '["${ELASTICSEARCH_DOCKER_URL:-http://elasticsearch:9200}"]'
    ports:
      - "127.0.0.1:${KIBANA_HOST_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 8s
      retries: 25
      start_period: 30s

  kibana-init:
    image: docker.elastic.co/kibana/kibana:8.19.24
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      KIBANA_URL: ${KIBANA_DOCKER_URL:-http://kibana:5601}
      ENTITY_INDEX: ${ELASTICSEARCH_ENTITY_INDEX:-named-entities}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /usr/share/kibana/node/glibc-217/bin/node <<'JS'
        const index = process.env.ENTITY_INDEX;
        const kibana = process.env.KIBANA_URL.replace(/\/$$/, "");
        const visId = "cs4371-top-entities";
        const dashboardId = "cs4371-entities";
        const title = "Top 10 named entities";
        const spec = {
          "$$schema": "https://vega.github.io/schema/vega-lite/v5.json",
          description: "Latest cumulative count for each of the 10 highest-ranked entities.",
          data: {
            url: {
              index,
              body: {
                size: 10,
                _source: ["entity", "count"],
                sort: [{count: "desc"}, {entity: "asc"}],
              },
            },
            format: {property: "hits.hits"},
          },
          transform: [{calculate: "datum._source.entity", as: "Entity"},
                      {calculate: "datum._source.count", as: "Count"}],
          mark: {type: "bar", color: "#0077a8", cornerRadiusEnd: 3},
          encoding: {
            y: {field: "Entity", type: "nominal", sort: "-x",
                axis: {title: null, labelLimit: 240}},
            x: {field: "Count", type: "quantitative", title: "Cumulative mentions",
                axis: {tickMinStep: 1}},
            tooltip: [{field: "Entity", type: "nominal"},
                      {field: "Count", type: "quantitative", format: ",d"}],
          },
        };
        const searchSourceJSON = JSON.stringify({query: {language: "kuery", query: ""}, filter: []});
        const visualization = {
          type: "visualization", id: visId, references: [],
          attributes: {
            title, description: spec.description,
            visState: JSON.stringify({title, type: "vega", params: {spec: JSON.stringify(spec, null, 2)}, aggs: []}),
            uiStateJSON: "{}", kibanaSavedObjectMeta: {searchSourceJSON},
          },
        };
        const panel = {
          panelIndex: "entities-chart", panelRefName: "panel_0",
          gridData: {i: "entities-chart", x: 0, y: 0, w: 48, h: 20},
          type: "visualization", embeddableConfig: {},
        };
        const dashboard = {
          type: "dashboard", id: dashboardId,
          references: [{name: "panel_0", type: "visualization", id: visId}],
          attributes: {
            title: "Hacker News named entities",
            description: "Latest cumulative totals from the named-entity stream. Refresh to see updated counts.",
            panelsJSON: JSON.stringify([panel]),
            optionsJSON: JSON.stringify({useMargins: true, hidePanelTitles: false}),
            timeRestore: false, kibanaSavedObjectMeta: {searchSourceJSON},
          },
        };
        async function install() {
          const form = new FormData();
          const ndjson = [visualization, dashboard].map(obj => JSON.stringify(obj)).join("\n") + "\n";
          form.append("file", new Blob([ndjson], {type: "application/ndjson"}), "entities.ndjson");
          const response = await fetch(kibana + "/api/saved_objects/_import?overwrite=true", {
            method: "POST", headers: {"kbn-xsrf": "cs4371-setup"}, body: form,
            signal: AbortSignal.timeout(30000),
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(JSON.stringify(result));
          console.log("Installed dashboard:", "/app/dashboards#/view/" + dashboardId);
        }
        install().catch(error => { console.error(error); process.exitCode = 1; });
        JS

volumes:
  kafka-data:
  elasticsearch-data:
  logstash-data:
