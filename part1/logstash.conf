input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}"
    topics => ["${KAFKA_TOPIC2:topic2}"]
    group_id => "${LOGSTASH_KAFKA_GROUP:cs4371-entity-indexer}"
    auto_offset_reset => "earliest"
    enable_auto_commit => false
    consumer_threads => 1
    codec => plain { charset => "UTF-8" }
  }
}

filter {
  json {
    source => "message"
    target => "[@metadata][entity_message]"
  }
  ruby {
    code => '
      data = event.get("[@metadata][entity_message]")
      entity = data.is_a?(Hash) ? data["entity"] : nil
      count = data.is_a?(Hash) ? data["count"] : nil
      if entity.is_a?(String) && !entity.strip.empty? && entity.bytesize <= 512 &&
          count.is_a?(Integer) && count >= 0 && count <= 9223372036854775807
        event.set("entity", entity)
        event.set("count", count)
        event.remove("message")
        event.remove("@version")
      else
        event.cancel
      end
    '
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    index => "${ENTITY_INDEX:named-entities}"
    document_id => "%{[entity]}"
    action => "index"
    ilm_enabled => false
    manage_template => false
    data_stream => "false"
  }
}
